<?xml version="1.0" encoding="UTF-8"?>
<!--
  Block-panel card for the Custom Design block.

  Built to match video_block.svg: the same 2115x1187 frame, the same flat #273c58
  field (sampled out of that file rather than guessed), and the block's own icon
  centred in the app blue. Generated by rendering the real Material Symbols glyph in
  a browser and embedding the result — the same shape every other scene card in this
  panel takes, an embedded bitmap inside an SVG wrapper.

  It is not a screenshot of the rendered block the way the others are, and cannot be:
  an unconfigured Custom Design block is an empty canvas, so a screenshot would show
  a dashed placeholder rather than what the block is for.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2115" height="1187" version="1.1" viewBox="0 0 2115 1187">
  <image width="2115" height="1187" xlink:href="data:image/png;base64,"/>
</svg>
