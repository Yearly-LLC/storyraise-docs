<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="s02-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        .copy { position: absolute; left: 150px; top: 250px; width: 760px; }
        .title { font-size: 118px; line-height: 1.02; margin-top: 22px; }
        .verdict {
          position: absolute;
          left: 150px;
          top: 700px;
          width: 700px;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 30px 36px;
        }
        .verdict svg { width: 64px; height: 64px; fill: #7fc55f; flex-shrink: 0; }
        .verdict p { font: 500 40px/1.25 "Poppins", sans-serif; color: #f4f0fa; margin: 0; }

        .panel { position: absolute; left: 1010px; top: 190px; width: 760px; padding: 48px 50px 40px; }
        .row { margin-bottom: 38px; }
        .row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
        .row-label { font: 600 30px/1 "Poppins", sans-serif; color: #f4f0fa; }
        .row-note { font: 400 24px/1 "Poppins", sans-serif; color: #a99fbb; }
        .track { position: relative; height: 66px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
        .bar { position: absolute; left: 0; top: 0; height: 66px; border-radius: 16px; transform-origin: 0 50%; }
        .bar-old { width: 640px; background: #48596b; }
        .bar-new { width: 400px; background: linear-gradient(90deg, #2c7f8a, #7fc55f 70%, #f5e04e); }
        .reloads { position: absolute; left: 22px; top: 13px; display: flex; gap: 14px; }
        .reloads svg { width: 40px; height: 40px; fill: rgba(255, 255, 255, 0.75); display: block; }

        .team { display: flex; align-items: center; gap: 18px; margin-top: 10px; padding-top: 30px; border-top: 1.5px solid rgba(255, 255, 255, 0.08); }
        .avatar {
          width: 70px;
          height: 70px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font: 600 26px/1 "Poppins", sans-serif;
          color: #1b1d21;
        }
        .team-text { font: 500 30px/1.3 "Poppins", sans-serif; color: #f4f0fa; margin-left: 10px; }
        .team-text span { display: block; font-size: 24px; font-weight: 400; color: #a99fbb; }
        .strike { position: absolute; left: 0; top: 0; width: 280px; height: 6px; border-radius: 3px; background: #ff7a99; transform-origin: 0 50%; }
        .avatars { position: relative; display: flex; gap: 12px; }
        .avatars .strike { top: 32px; left: -10px; width: 250px; }
      </style>

      <div id="root" data-composition-id="s02" data-width="1920" data-height="1080">
        <div class="copy">
          <p class="sr-kicker" id="s02-kicker">What's new</p>
          <p class="sr-display title" id="s02-title">Analytics, <span class="sr-accent">rebuilt.</span></p>
        </div>

        <div class="panel sr-card" id="s02-panel">
          <div class="row" id="s02-row-old">
            <div class="row-head"><span class="row-label">Before</span><span class="row-note">Every page load counted</span></div>
            <div class="track">
              <div class="bar bar-old" id="s02-bar-old"></div>
              <div class="reloads" id="s02-reloads">
                <svg viewBox="0 -960 960 960"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
                <svg viewBox="0 -960 960 960"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
                <svg viewBox="0 -960 960 960"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
              </div>
            </div>
          </div>
          <div class="row" id="s02-row-new">
            <div class="row-head"><span class="row-label">Now</span><span class="row-note">Real visits</span></div>
            <div class="track"><div class="bar bar-new" id="s02-bar-new"></div></div>
          </div>
          <div class="team" id="s02-team">
            <div class="avatars">
              <div class="avatar" style="background:#c79bf2">AL</div>
              <div class="avatar" style="background:#7fc55f">JR</div>
              <div class="avatar" style="background:#f5d63d">MK</div>
              <div class="strike" id="s02-strike"></div>
            </div>
            <p class="team-text">Your team's visits<span>Left out automatically</span></p>
          </div>
        </div>

        <div class="verdict sr-card" id="s02-verdict">
          <svg viewBox="0 -960 960 960"><path d="m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg>
          <p>Lower totals? <span class="sr-accent">That's accuracy.</span></p>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        (function () {
          var S = window.SR_TIMELINE.scenes.s02;
          var cue = function (name) { return S.cues[name] - S.start; };
          var tl = gsap.timeline({ paused: true });

          tl.fromTo('#s02-kicker', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, cue('rebuilt') - 0.1);
          tl.fromTo('#s02-title', { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, cue('rebuilt'));
          tl.fromTo('#s02-panel', { autoAlpha: 0, x: 80 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: 'power3.out' }, cue('rebuilt') + 0.35);

          // "Page reloads no longer inflate your numbers"
          var r = cue('reloads');
          tl.fromTo('#s02-bar-old', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power2.out' }, r);
          tl.fromTo('#s02-reloads svg', { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(2)', stagger: 0.12 }, r + 0.2);
          tl.fromTo('#s02-bar-new', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power2.out' }, r + 0.9);

          // "and your own team's visits are left out automatically."
          var t = cue('team');
          tl.fromTo('#s02-team', { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: 'power3.out' }, t);
          tl.fromTo('#s02-strike', { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power2.inOut' }, t + 0.7);
          tl.to('#s02-team .avatar', { autoAlpha: 0.35, duration: 0.4 }, t + 0.9);

          // "So if your totals look a little lower than before, that isn't a drop. It's accuracy."
          tl.fromTo('#s02-verdict', { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out' }, cue('lower') + 0.2);

          tl.to('#root > *', { autoAlpha: 0, y: -20, duration: 0.45, ease: 'power2.in', stagger: 0.03 }, S.duration - 0.55);
          window.__timelines['s02'] = tl;
        })();
      </script>
