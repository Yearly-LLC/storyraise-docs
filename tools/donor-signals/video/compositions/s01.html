<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="s01-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        .line {
          position: absolute; left: 0; width: 1920px; text-align: center;
          font: 400 78px/1.2 "PPFragment TextRegular", serif; color: #ffffff;
          opacity: 0; visibility: hidden;
          /* Even the two lines rather than leaving one word stranded on the second. */
          text-wrap: balance; max-width: 1400px; margin: 0 auto; right: 0;
        }
        /*
            Both lines are a single line now, so they share a top and the cross-fade
            between them does not move.
        */
        #s01-l1 { top: 400px; }
        #s01-l2 { top: 400px; }
        /*
            The dots are the donor file: one per donor, filling in as the voice says the
            database knows who gave. Two rows read as a list of people; a single row of
            eight read as nothing in particular. They all start the same colour, because
            the point of the line over them is that you cannot tell them apart. Three
            light up only after "Which ones?" has been asked, as the answer arriving.
        */
        .faces { position: absolute; left: 50%; top: 596px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(9, 1fr); gap: 18px; }
        .face {
          width: 58px; height: 58px; border-radius: 50%; opacity: 0;
          background: #2f4256; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
        }
        /*
            The title lockup follows the one the Analytics tour established: the square
            mark centred over the title, an accent on the second word, and three pills
            naming what the product answers. The wordmark SVG was used here first and
            laid out wider than the stage, which pushed it off the left edge.
        */
        .brand {
          position: absolute; left: 0; top: 300px; width: 1920px; text-align: center;
          opacity: 0; visibility: hidden;
        }
        .brand-logo { display: block; width: 128px; height: 128px; margin: 0 auto; }
        .brand-title { font-size: 132px; line-height: 1.05; margin-top: 30px; }
        .brand-sub { margin-top: 26px; font: 500 34px/1.4 "Poppins", sans-serif; color: #cfc7dc; }
        .brand-pills { margin-top: 40px; }
        .brand-pills .sr-pill { margin: 0 9px; }
      </style>

      <div id="root" data-composition-id="s01" data-width="1920" data-height="1080">
        <!--
            The card sets up what the voice argues, it does not repeat it. The voice
            opens "Your donor database knows who gave. It cannot tell you who is about
            to stop", so the card shows the file, then the question, while the dots fill
            in and two of them light.
        -->
        <div class="line" id="s01-l1">Every name in your database.</div>
        <div class="line" id="s01-l2">Which ones?</div>
        <div class="faces" id="s01-faces">
          <i class="face"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face lit"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face lit"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face"></i>
          <i class="face lit"></i>
          <i class="face"></i>
          <i class="face"></i>
        </div>
        <div class="brand" id="s01-brand">
          <img class="brand-logo" id="s01-logo" src="assets/logo-icon.svg" alt="" />
          <p class="sr-display brand-title" id="s01-title">Donor <span class="sr-accent">Signals</span></p>
          <p class="brand-sub" id="s01-sub">Scored overnight, every day.</p>
          <div class="brand-pills" id="s01-pills">
            <span class="sr-pill">Who needs you</span>
            <span class="sr-pill">Why now</span>
            <span class="sr-pill">What to make</span>
          </div>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        (function () {
          var T = window.SR_TIMELINE;
          var S = T.scenes.s01;
          var start = T.hosts.s01.start;
          var L = function (t) { return Math.max(0, t - start); };
          var tl = gsap.timeline({ paused: true });

          tl.fromTo('#s01-l1', { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.25);
          tl.to('#s01-l1', { autoAlpha: 0, y: -22, duration: 0.4, ease: 'power2.in' }, L(S.cues.question) - 0.15);
          tl.fromTo('#s01-l2', { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, L(S.cues.question) + 0.1);

          // The file fills in, one donor at a time, while the voice says the database
          // knows who gave. Then three of them light: the answer to "Which ones?".
          gsap.utils.toArray('#s01-faces .face').forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out' }, 0.45 + i * 0.055);
          });
          gsap.utils.toArray('#s01-faces .face.lit').forEach(function (el, i) {
            // #ed355e is the logo's own red, straight out of assets/logo-icon.svg.
            tl.to(el, {
              backgroundColor: '#ed355e',
              boxShadow: '0 0 0 3px rgba(237,53,94,0.35), 0 0 26px rgba(237,53,94,0.55)',
              duration: 0.45,
              ease: 'power2.out',
            }, L(S.cues.question) + 0.85 + i * 0.16);
          });
          tl.fromTo('#s01-faces', { y: 10 }, { y: 0, duration: 3.2, ease: 'sine.out' }, 0.45);
          tl.to('#s01-faces', { autoAlpha: 0, duration: 0.35, ease: 'power2.in' }, L(S.cues.brand) - 0.25);
          tl.to('#s01-l2', { autoAlpha: 0, y: -22, duration: 0.35, ease: 'power2.in' }, L(S.cues.brand) - 0.25);

          tl.fromTo('#s01-brand', { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out' }, L(S.cues.brand));
          tl.fromTo('#s01-logo', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.6)' }, L(S.cues.brand) + 0.05);
          gsap.utils.toArray('#s01-pills .sr-pill').forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, L(S.cues.brand) + 0.5 + i * 0.12);
          });
          tl.to('#s01-brand', { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, T.hosts.s01.duration - 0.45);

          window.__timelines['s01'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
