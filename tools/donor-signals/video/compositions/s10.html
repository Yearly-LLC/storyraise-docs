<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="s10-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        .outro-logo { display: block; width: 96px; height: 96px; margin: 0 auto 28px; }
        .wrap { position: absolute; left: 0; top: 330px; width: 1920px; text-align: center; opacity: 0; visibility: hidden; }
        .wrap img { height: 64px; }
        .wrap h2 { margin: 34px 0 0; font: 400 76px/1.15 "PPFragment TextRegular", serif; color: #ffffff; }
        .wrap p { margin: 24px 0 0; font: 500 32px/1.5 "Poppins", sans-serif; color: rgba(255,255,255,0.68); }
        .pill {
          display: inline-block; margin-top: 42px; padding: 20px 40px; border-radius: 999px;
          background: #286ea6; color: #ffffff; font: 600 30px/1 "Poppins", sans-serif;
        }
      </style>

      <div id="root" data-composition-id="s10" data-width="1920" data-height="1080">
        <div class="wrap" id="s10-wrap">
          <!--
              The icon, not the wordmark: logo-wordmark-dark.svg lays out wider than the
              stage and its left edge was being cut flat at x=0. Same trap the title card hit.
          -->
          <img class="outro-logo" src="assets/logo-icon.svg" alt="" />
          <h2>See what your own week looks like</h2>
          <p>The demo below is the real page, with sample data.</p>
          <span class="pill">Try it on this page</span>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        (function () {
          var T = window.SR_TIMELINE;
          var start = T.hosts.s10.start;
          var tl = gsap.timeline({ paused: true });
          tl.fromTo('#s10-wrap', { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.15);
          tl.to('#s10-wrap', { autoAlpha: 0, duration: 0.5, ease: 'power2.in' }, T.hosts.s10.duration - 0.6);
          window.__timelines['s10'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
