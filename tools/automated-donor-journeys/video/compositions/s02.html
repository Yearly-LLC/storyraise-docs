        .s02-card { position: absolute; top: 330px; width: 470px; height: 420px; box-sizing: border-box; padding: 46px 44px; opacity: 0; visibility: hidden; }
        #s02-crm { left: 150px; }
        #s02-report { left: 725px; }
        #s02-email { left: 1300px; }
        .s02-icon { width: 104px; height: 104px; border-radius: 26px; background: rgba(199, 155, 242, 0.16); display: flex; align-items: center; justify-content: center; }

        #s02-arrow-1 { left: 632px; }
        #s02-arrow-2 { left: 1207px; }

      <div id="s02-root" data-composition-id="s02" data-width="1920" data-height="1080">
        <p class="sr-kicker" id="s02-kicker">Three things you may already have</p>

        <div class="sr-card s02-card" id="s02-crm">
          <div class="s02-icon"><svg viewBox="0 0 48 48" fill="none" stroke="#e1c2ff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><ellipse cx="24" cy="11" rx="15" ry="6"/><path d="M9 11v26c0 3.3 6.7 6 15 6s15-2.7 15-6V11"/><path d="M9 24c0 3.3 6.7 6 15 6s15-2.7 15-6"/></svg></div>

        </div>
        <div class="s02-arrow" id="s02-arrow-1"><svg viewBox="0 0 86 10" aria-hidden="true"><path d="M0 5h76" stroke="#c79bf2" stroke-width="3"/><path d="M74 0l12 5-12 5z" fill="#c79bf2"/></svg></div>

      <script src="assets/gsap.min.js"></script>
      <script>
        (function () {
          var S = window.SR_TIMELINE.scenes.s02;
          var cue = function (name) { return S.cues[name] - S.start; };
          var tl = gsap.timeline({ paused: true });
          var rise = { autoAlpha: 1, y: 0, duration: 0.65, ease: 'power3.out' };

          tl.fromTo('#s02-kicker', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, Math.max(0.05, cue('pieces')));
          tl.fromTo('#s02-crm', { autoAlpha: 0, y: 60 }, rise, cue('crm') - 0.15);
          tl.fromTo('#s02-arrow-1', { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.45, ease: 'power2.out' }, cue('report') - 0.3);
          tl.fromTo('#s02-report', { autoAlpha: 0, y: 60 }, rise, cue('report') - 0.15);
          tl.fromTo('#s02-arrow-2', { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.45, ease: 'power2.out' }, cue('email') - 0.3);
          tl.fromTo('#s02-email', { autoAlpha: 0, y: 60 }, rise, cue('email') - 0.15);

          tl.to('#s02-root > *', { autoAlpha: 0, duration: 0.45, ease: 'power2.in' }, S.duration - 0.5);
          window.__timelines['s02'] = tl;
        })();
      </script>
